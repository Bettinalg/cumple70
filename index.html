  @keyframes bloom{
    from{ opacity: 0; transform: scale(1.06); }
    to  { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .floral-frame{ animation: none; }
  }

  /* ---- contenido que se desliza ---- */
  .wrap{
    position: relative;
    z-index: 2;
    padding: 16vh calc(var(--col) * 0.12) 24vh;   /* abajo: deja lugar para que el final quede sobre las flores */
    max-width: var(--col);
    margin: 0 auto;
  }

  .section{
    min-height: 62vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .section.is-visible{
    opacity: 1;
    transform: translateY(0);
  }
  .section:last-child{ min-height: 50vh; padding-bottom: 4vh; }

  @media (prefers-reduced-motion: reduce){
    .section{ transition: none; opacity: 1; transform: none; }
  }

  .eyebrow{
    font-size: clamp(1.75rem, 7.6vw, 2.3rem);
    letter-spacing: 0.04em;
    color: var(--sage);
    max-width: 15ch;
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
  }

  h1.name{
    font-family: 'Parisienne', cursive;
    font-weight: 400;
    font-size: clamp(5rem, 28vw, 8rem);
    line-height: 1;
    color: var(--rose);
    margin: 0;
  }

  .mis70{
    font-size: clamp(2.5rem, 11vw, 3.4rem);
    letter-spacing: 0.06em;
    color: var(--plum);
    font-weight: 600;
    margin: 6px 0 0;
  }

  .ornament{
    width: 130px;
    height: 24px;
    margin-bottom: 18px;
    opacity: 0.85;
  }

  .datebox{
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(178,58,85,0.18);
    border-radius: 20px;
    padding: 22px 22px;
  }
  .datebox .big{
    font-size: clamp(2.2rem, 9.4vw, 3rem);
    color: var(--rose);
    font-weight: 600;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .datebox .sub{
    font-size: 1.5rem;
    color: var(--sage);
    margin: 8px 0 0;
    letter-spacing: 0.04em;
  }

  .timebox .big{
    font-size: clamp(3.4rem, 16vw, 5rem);
    color: var(--plum);
    font-weight: 600;
    line-height: 1;
    margin: 0;
  }
  .timebox .sub{
    font-size: 1.5rem;
    color: var(--sage);
    margin: 8px 0 0;
  }

  .placebox .big{
    font-size: clamp(2.3rem, 10vw, 3.1rem);
    color: var(--ink);
    font-weight: 600;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
